# Builds the XGo+ SMS Listener (Android) and publishes the APK to the
# "sms-listener" GitHub release:
#   https://github.com/jurabus/xgoplus/releases/download/sms-listener/xgo-sms-listener.apk
name: Android SMS listener

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-sms-listener.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the private signing key from secrets
        env:
          SMS_KEYSTORE_B64: ${{ secrets.SMS_KEYSTORE_B64 }}
          SMS_KEYSTORE_PASSWORD: ${{ secrets.SMS_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$SMS_KEYSTORE_B64" ] || [ -z "$SMS_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the SMS_KEYSTORE_B64 and SMS_KEYSTORE_PASSWORD repository secrets first."; exit 1
          fi
          echo "$SMS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sms-release.jks"
          echo "SMS_KEYSTORE_PATH=$RUNNER_TEMP/sms-release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          SMS_KEYSTORE_PASSWORD: ${{ secrets.SMS_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/sms-release.jks"
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk xgo-sms-listener.apk
      - name: Point the release tag at this commit
        run: |
          git tag -f sms-listener
          git push -f origin refs/tags/sms-listener
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: sms-listener
          name: XGo+ SMS Listener (Android)
          body: |
            Install on the Android phone that holds the InstaPay / wallet SIM, then pair it from Admin → Payments → Automatic payments.
            Build ${{ github.run_number }} · commit ${{ github.sha }}
          files: xgo-sms-listener.apk
          make_latest: false
